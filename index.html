<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: rgb(194, 226, 231);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        color: white;
      }
      .container {
        width: 720px;
        border: solid white 2px;
      }
      ul {
        padding: 0;
        list-style-type: none;
      }
      li {
        padding: 10px 0px;
      }
      .task-text {
        padding: 6px 0px;
        border-bottom: solid rgb(4, 0, 112) 2px;
      }
      .task-text,
      .id {
        font-size: 18px;
        width: 570px;
        overflow: hidden;
      }
      #task_Input {
        width: 400px;
        padding: 5px 10px;
        background-color: transparent;
        border: solid white 2px;
      }
      button {
        padding: 0px 10px;
        border: solid rgb(255, 255, 255) 2px !important;
      }
      input:focus,
      button:focus {
        outline: none;
      }
      button:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <!-- header -->
    <header
      class="container bg-secondary p-2 border-light rounded-top sticky-top top-2 mt-2 d-flex"
    >
      <div class="mx-auto w-auto d-flex align-items-center p-1 gap-2 h-75">
        <div>
          <label for="task_Input" class="text-light">Task</label>
        </div>
        <div>
          <input class="text-light" type="text" id="task_Input" />
        </div>
        <div>
          <button
            id="btn_add"
            class="btn text-Meduim btn-primary border-1 border-light pt-1 pb-1"
          >
            Add Task
          </button>
        </div>
      </div>
    </header>

    <!-- task container -->
    <div
      id="list_container"
      class="p-2 container bg-secondary mt-2 rounded-bottom"
    >
      <!-- task -->
      <ul id="list_task"></ul>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    //icon svg
    let iconDelte =
      '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="red" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-icon lucide-trash"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    let iconDone =
      '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="Green" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check-icon lucide-check"><path d="M20 6 9 17l-5-5" /></svg>';
    let iconEdit = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="yellow" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-icon lucide-pencil" > <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /> <path d="m15 5 4 4" /> </svg>`;
    let iconUndo = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="red" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-undo2-icon lucide-undo-2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>`;
    //---------
    let btn_add = document.getElementById("btn_add");
    let task_Input = document.getElementById("task_Input");
    let list_task = document.getElementById("list_task");
    const object_task = [];

    reder_task();


    btn_add.addEventListener("click", add_Task);
    task_Input.addEventListener("keypress", handle_enter_click);
    let taskCount = 1;

    function handle_enter_click(event) {
      if (event.key === "Enter") {
        btn_add.click();
      }
    }
    function reder_task() {
      if (object_task.length === 0) {
        document.getElementById("list_task").innerHTML =
          "<h3 class='text-light text-center'>No Tasks Available</h3>";
        btn_add.innerText = "Add Task";
        return;
      }

      for (let item of object_task) {
        console.log(item);
        list_task.innerHTML += task(item);
      }
    }
    //let countTask = 0;
    function add_Task() {
      // update task
      if (btn_add.innerText === "Update Task") {
        for (let c = 0; c < object_task.length; c++) {
          if (index !== c && object_task[c].text === task_Input.value) {
            console.log('index', index)
            console.log('c', c)
            duplicatAlert(object_task[c].id);
            return;
          }
        }
        object_task[index].text = task_Input.value;
        btn_add.innerText = "Add Task";
        clear();
        reder_task();
      } else {
        // add
        let task = task_Input.value;
        for (let item of object_task) {
          if (item.text === task) {
            duplicatAlert(item.id);
            task_Input.focus();
            return;
          }
        }
        if (task.trim() !== "") {
          object_task.push({
            id: object_task.length + 1,
            text: task,
            isDone: false,
          });
          task_Input.focus();
          clear();
          reder_task();
        } else {
          alert("Your input is empty");
        }
      }
    }

    let index = 0;
    function editTask(id) {
      for (let i = 0; i < object_task.length; i++) {
        if (object_task[i].id === id) {
          task_Input.focus();
          task_Input.value = object_task[i].text;
          btn_add.innerText = "Update Task";
          index = i;
          return;
        }
      }
    }
    
    function handleDeleteTask(id) {
      for (let c = 0; c < object_task.length; c++) {
        if (object_task[c].id === id) {
          Swal.fire({
            title: "Are you sure?",
            text: "You won't be able to revert this!",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#3085d6",
            cancelButtonColor: "#d33",
            confirmButtonText: "Yes, delete it!",
          }).then((result) => {
            if (result.isConfirmed) {
              // using when delete while updating it will clear if not the edite are still the old value
              if (object_task[c].text === task_Input.value) {
                task_Input.value = "";
                btn_add.innerText = "Add Task";
              }
              object_task.splice(c, 1);
              list_task.innerHTML = "";
              reder_task();
              return;
            }
          });
        }
      }
    }


    function handleDoneTask(id) {
      for (let i = 0; i < object_task.length; i++) {
        if (object_task[i].id === id) {
          object_task[i].isDone = !object_task[i].isDone;
          clear();
          reder_task();
          return;
        }
      }
    }

    function clear() {
      task_Input.value = "";
      list_task.innerHTML = "";
    }


    function duplicatAlert(id) {
      Swal.fire({
        title: `Duplicate with task id : ${id} !`,
        showClass: {
          popup: `
          animate__animated
          animate__fadeInUp
          animate__faster
          `,
        },
        hideClass: {
          popup: `
          animate__animated
          animate__fadeOutDown
          animate__faster
          `,
        },
      });
    }


    function printTask(task) {
      if (task.isDone) {
        return `<p class="task-text"><del><strong>${task.id}, </strong>${task.text}</del></p>`;
      }
      return `<p class="task-text"><strong>${task.id}, </strong>${task.text}</p>`;
    }


    function task(item) {
      return `
      
      <li>
          <div class="w-100 d-flex justify-content-between">
            <div>
             ${printTask(item)}
            </div>
            <div>
              <button class="btn p-1"
                onClick="handleDeleteTask(${item.id})"
              >
                ${iconDelte}
              </button>
              <button  class="btn p-1"
                onClick="handleDoneTask(${item.id})"
              >
                ${item.isDone ? iconUndo : iconDone}
              </button>
              <button class="btn p-1"
                onClick="editTask(${item.id})"
              >
                ${iconEdit}
              </button>
            </div>
          </div>
        </li>
      `;
    }
  </script>
</html>
